<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Bilingual Rental Agreement (Full Version)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap'); body{font-family:'Sarabun',sans-serif; background-color:#f3f4f6;}</style>
</head>
<body class="p-4">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-3xl shadow-2xl">
        <h1 class="text-2xl font-bold mb-6 text-center">ระบบสัญญาเช่าอัจฉริยะ (ฉบับสมบูรณ์)</h1>
        
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="border-2 border-dashed p-4 rounded-xl text-center">
                <p class="text-sm mb-2">บัตรประชาชนผู้ให้เช่า</p>
                <input type="file" accept="image/*" onchange="handleUpload(event, 'landlordImg', 'img-ll')">
                <img id="img-ll" class="mt-2 h-20 mx-auto">
            </div>
            <div class="border-2 border-dashed p-4 rounded-xl text-center">
                <p class="text-sm mb-2">พาสปอร์ตผู้เช่า</p>
                <input type="file" accept="image/*" onchange="handleUpload(event, 'tenantImg', 'img-tn')">
                <img id="img-tn" class="mt-2 h-20 mx-auto">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <input type="text" id="propNo" placeholder="บ้านเลขที่" class="border p-2 rounded">
            <input type="text" id="propProj" placeholder="โครงการ" class="border p-2 rounded">
            <input type="number" id="rentAmt" placeholder="ค่าเช่าต่อเดือน" oninput="calc()" class="border p-2 rounded">
            <input type="number" id="depMonths" placeholder="เงินประกัน (เดือน)" oninput="calc()" class="border p-2 rounded">
        </div>
        <div class="mb-6 bg-blue-50 p-4 rounded-xl">
            <p>รวมยอดแรกเข้า: <span id="totalDisplay" class="font-bold text-xl">0</span> บาท</p>
        </div>

        <div class="mb-6">
            <canvas id="sig-pad" class="border w-full h-40 rounded-xl bg-gray-50"></canvas>
            <button onclick="clearSig()" class="mt-2 text-sm text-red-500">ล้างลายเซ็น</button>
        </div>

        <button id="saveBtn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold mb-4">🚀 บันทึกข้อมูลและลายเซ็นขึ้น Cloud</button>
        <div class="grid grid-cols-2 gap-4">
            <button id="copyLL" class="bg-emerald-600 text-white py-2 rounded-lg text-sm">🔗 ลิงก์เจ้าของบ้าน</button>
            <button id="copyTN" class="bg-purple-600 text-white py-2 rounded-lg text-sm">🔗 ลิงก์ผู้เช่า</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = { apiKey: "AIzaSyA123-Placeholder", authDomain: "huahin-contract-app.firebaseapp.com", projectId: "huahin-contract-app", storageBucket: "huahin-contract-app.appspot.com", appId: "1:1234567890:web:abcdef123456" };
        const db = getFirestore(initializeApp(firebaseConfig));
        const urlParams = new URLSearchParams(window.location.search);
        const contractId = urlParams.get('id') || 'doc_88_9';
        const userRole = urlParams.get('role') || 'landlord';
        const sigPad = new SignaturePad(document.getElementById('sig-pad'));
        
        let localData = { landlordImg: '', tenantImg: '' };

        window.handleUpload = (e, key, imgId) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 400; canvas.height = 200;
                    canvas.getContext('2d').drawImage(img, 0, 0, 400, 200);
                    localData[key] = canvas.toDataURL('image/jpeg', 0.5);
                    document.getElementById(imgId).src = localData[key];
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        window.calc = () => {
            const total = (parseFloat(document.getElementById('rentAmt').value) || 0) * (1 + (parseInt(document.getElementById('depMonths').value) || 0));
            document.getElementById('totalDisplay').innerText = total.toLocaleString();
        };

        window.clearSig = () => sigPad.clear();

        document.getElementById('saveBtn').addEventListener('click', async () => {
            const data = {
                propNo: document.getElementById('propNo').value,
                rentAmt: document.getElementById('rentAmt').value,
                ...localData
            };
            if(!sigPad.isEmpty()) data[userRole + 'Sig'] = sigPad.toDataURL();
            await setDoc(doc(db, "contracts", contractId), data, { merge: true });
            alert("บันทึกสำเร็จ!");
        });

        document.getElementById('copyLL').onclick = () => navigator.clipboard.writeText(window.location.origin + window.location.pathname + '?id=' + contractId + '&role=landlord');
        document.getElementById('copyTN').onclick = () => navigator.clipboard.writeText(window.location.origin + window.location.pathname + '?id=' + contractId + '&role=tenant');
    </script>
</body>
</html>
