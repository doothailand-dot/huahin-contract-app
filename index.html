<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Rental Agreement - Full Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .full-layout { max-width: 900px; margin: auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .hidden-role { display: none !important; }
    </style>
</head>
<body class="p-4">
    <div class="full-layout" id="main-container">
        <h1 class="text-3xl font-bold text-center mb-8">สัญญาเช่าที่พักอาศัย</h1>
        
        <div id="agent-tools" class="bg-gray-100 p-4 rounded-xl mb-6">
            <p class="font-bold mb-2">เครื่องมือแอดมิน (เห็นเฉพาะแอดมิน):</p>
            <div class="grid grid-cols-2 gap-4">
                <input type="text" id="propNo" placeholder="บ้านเลขที่" class="border p-2 rounded">
                <input type="number" id="rentAmt" placeholder="ค่าเช่า" class="border p-2 rounded">
            </div>
        </div>

        <div id="contract-view" class="space-y-6">
            <div id="signature-section" class="border-t pt-6">
                <canvas id="sig-pad" class="border-2 border-dashed w-full h-40 rounded-xl bg-gray-50"></canvas>
                <button onclick="clearSig()" class="text-red-500 text-sm mt-2">ล้างลายเซ็น</button>
            </div>
            
            <button id="saveBtn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold text-lg">🚀 บันทึกและส่งข้อมูล</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const db = getFirestore(initializeApp({ apiKey: "AIzaSyA123-Placeholder", projectId: "huahin-contract-app" }));
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role') || 'landlord';

        // ปิดการแสดงผลปุ่ม/ฟอร์มตามบทบาท
        if(role === 'tenant') {
            document.getElementById('agent-tools').classList.add('hidden-role');
        }

        const sigPad = new SignaturePad(document.getElementById('sig-pad'));
        window.clearSig = () => sigPad.clear();

        document.getElementById('saveBtn').addEventListener('click', async () => {
            const data = {
                propNo: document.getElementById('propNo').value,
                [role + 'Sig']: sigPad.toDataURL()
            };
            await setDoc(doc(db, "contracts", "doc_88_9"), data, { merge: true });
            alert("บันทึกสำเร็จ");
        });
    </script>
</body>
</html>
